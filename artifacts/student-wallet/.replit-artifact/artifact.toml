kind = "mobile"
previewPath = "/"
title = "Student Wallet"
description = "A mobile student wallet app based on the provided Figma design, ready to preview and run."
version = "1.0.0"
id = "artifacts/student-wallet"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25379

[services.development]
run = "pnpm --filter @workspace/student-wallet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/student-wallet", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/student-wallet", "run", "serve" ]

[services.env]
PORT = "25379"
BASE_PATH = "/"
